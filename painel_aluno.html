<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Aluno | BJJ Exams</title>
    <link rel="icon" type="image/png" href="logo_bjjexems.png">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-main: #0B1120; --bg-panel: #0F172A; --bg-card: #1E293B; --bg-input: #0F172A; 
            --text-main: #FFFFFF; --text-muted: #94A3B8; --border-color: #334155; --border-panel: #1E293B; 
            --brand-color: #00FFD1; --brand-hover: #FFFFFF;
        }
        .light-mode {
            --bg-main: #F8FAFC; --bg-panel: #FFFFFF; --bg-card: #FFFFFF; --bg-input: #F1F5F9; 
            --text-main: #0F172A; --text-muted: #64748B; --border-color: #E2E8F0; --border-panel: #E2E8F0; 
            --brand-color: #059669; --brand-hover: #047857;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap');

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
        
        @media print {
            body * { display: none !important; }
            body { background-color: #000 !important; }
            body::before {
                content: "⚠️ VIOLAÇÃO DE SEGURANÇA: A impressão ou cópia deste material é estritamente proibida.";
                display: block !important; color: #FF4B4B !important; font-size: 24px; font-family: Arial, sans-serif; font-weight: bold; text-align: center; padding: 50px; margin-top: 20%;
            }
        }
        .no-select { user-select: none; -webkit-user-select: none; -ms-user-select: none; }

        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .nav-item.active { background-color: rgba(0, 255, 209, 0.1); border-left: 4px solid var(--brand-color); color: var(--brand-color); }
        .opcao-prova.selecionada { background-color: rgba(0, 255, 209, 0.1); border-color: var(--brand-color); color: var(--brand-color); font-weight: 900; }
        .swal2-popup { border: 1px solid var(--border-color) !important; border-radius: 1.5rem !important; }
        .option-btn { border: 2px solid var(--border-color); transition: all 0.2s; }
        .option-btn:hover { border-color: var(--brand-color); background-color: rgba(0, 255, 209, 0.05); }
        .option-btn.selected { border-color: var(--brand-color); background-color: rgba(0, 255, 209, 0.1); color: white; font-weight: bold; }
        .svg-icon { width: 1.25rem; height: 1.25rem; fill: currentColor; }
        .nav-item .svg-icon { width: 1.5rem; height: 1.5rem; }
    </style>
    
    <script>
        tailwind.config = { theme: { extend: { colors: { neon: 'var(--brand-color)', darkbg: 'var(--bg-main)', cardbg: 'var(--bg-card)', panelbg: 'var(--bg-panel)', slate: { 900: 'var(--bg-input)', 800: 'var(--border-panel)', 700: 'var(--border-color)', 500: 'var(--text-muted)', 400: 'var(--text-muted)' }, white: 'var(--text-main)' } } } };
        if (localStorage.getItem('tema_bjj') === 'light') document.documentElement.classList.add('light-mode');
    </script>
</head>
<body class="h-screen flex overflow-hidden relative no-select">

    <!-- SIDEBAR -->

        <nav class="flex-1 py-4 flex flex-col gap-1 overflow-y-auto custom-scroll" id="menu-lateral">
            <button onclick="window.mudarAba(event, 'dashboard')" id="btn-menu-dashboard" class="nav-item active flex items-center gap-3 px-6 py-3.5 text-slate-400 hover:text-white transition-all text-sm font-bold w-full text-left">

                <svg viewBox="0 0 24 24" class="svg-icon"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg> Meus Cursos

            <button onclick="window.mudarAba(event, 'sala-exame')" class="nav-item flex items-center gap-3 px-6 py-3.5 text-slate-400 hover:text-white transition-all text-sm font-bold w-full text-left">

            <button onclick="window.mudarAba(event, 'modo-rola')" class="nav-item flex items-center justify-between px-6 py-3.5 text-slate-400 hover:text-white transition-all text-sm font-bold w-full text-left">

                </div>
            </button>
            <button onclick="window.mudarAba(event, 'ranking')" class="nav-item flex items-center gap-3 px-6 py-3.5 text-amber-500 hover:text-white transition-all text-sm font-bold w-full text-left">
                <svg viewBox="0 0 24 24" class="svg-icon"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3 4H9v-1c0-1.33 2.67-2 4-2s4 .67 4 2v1z"/></svg> Ranking Geral
            </button>
            <button onclick="window.mudarAba(event, 'certificados')" id="btn-menu-certificados" class="nav-item flex items-center gap-3 px-6 py-3.5 text-slate-400 hover:text-white transition-all text-sm font-bold w-full text-left">
                <svg viewBox="0 0 24 24" class="svg-icon"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg> Meus Certificados
            </button>
            <button onclick="window.mudarAba(event, 'perfil')" class="nav-item flex items-center gap-3 px-6 py-3.5 text-slate-400 hover:text-white transition-all text-sm font-bold w-full text-left">
                <svg viewBox="0 0 24 24" class="svg-icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg> Meu Perfil
            </button>

        <div class="p-4 border-t border-slate-800">
            <button onclick="window.toggleTema()" id="btn-tema" class="w-full bg-slate-800 text-slate-400 border border-slate-700 px-4 py-3 rounded-xl text-xs font-bold uppercase transition-all flex items-center justify-center gap-2 hover:text-white mb-3 shadow-md">
                Modo Claro
            </button>
            <button onclick="window.fazerLogout()" class="w-full bg-rose-500/10 text-rose-500 border border-rose-500/30 px-4 py-3 rounded-xl text-xs font-bold uppercase transition-all flex items-center justify-center gap-2 hover:bg-rose-500 hover:text-white shadow-md">
                <svg viewBox="0 0 24 24" class="svg-icon"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg> Sair
            </button>
        </div>
    </aside>
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-darkbg transition-colors w-full" id="area-painel-scroll">
        <header class="h-20 bg-panelbg/80 backdrop-blur-md border-b border-slate-800 flex items-center px-4 sm:px-8 z-10 sticky top-0 justify-between transition-colors w-full">
            <div class="flex items-center gap-3 w-full">
                <button onclick="window.toggleSidebar()" class="md:hidden text-slate-400 hover:text-white transition-colors">
                    <svg viewBox="0 0 24 24" class="w-8 h-8 fill-current"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <h1 class="text-lg sm:text-xl font-black text-white uppercase tracking-wider truncate" id="titulo-pagina">Início</h1>
            </div>
            <div class="hidden md:block">
                <span class="text-xs text-slate-400 font-bold uppercase tracking-widest bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl shadow-inner flex items-center gap-2">
                    <span id="header-equipe" class="text-white">---</span>
                </span>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto custom-scroll p-4 sm:p-8 w-full relative" id="main-content">
            <div class="max-w-5xl mx-auto">
                    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, updateDoc, setDoc, query, where, onSnapshot, serverTimestamp, addDoc, orderBy, limit, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDMYhKseehy_V0bmotTo63WPJgcsz4sFwI",
          authDomain: "bjj-exams.firebaseapp.com",
          projectId: "bjj-exams",
          storageBucket: "bjj-exams.firebasestorage.app",
          messagingSenderId: "682125845998",
          appId: "1:682125845998:web:bf58e915a2860bc79e5aff"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const swalDark = Swal.mixin({
            background: 'var(--bg-card)', color: 'var(--text-main)', confirmButtonColor: 'var(--brand-color)', cancelButtonColor: '#F43F5E',
            customClass: { title: 'font-black uppercase tracking-widest text-lg', htmlContainer: 'text-sm text-slate-300', confirmButton: 'text-slate-900 font-black rounded-xl px-6 py-3 uppercase tracking-widest shadow-lg', cancelButton: 'text-white font-black rounded-xl px-6 py-3 uppercase tracking-widest shadow-lg hover:scale-105 transition-transform' }
        });

        // SEGURANÇA: Bloqueia Print Screen e Impressão
        document.addEventListener('contextmenu', event => event.preventDefault()); 
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); swalDark.fire('Aviso', 'A impressão deste material foi desativada.', 'warning'); }
            if (e.key === 'PrintScreen') { navigator.clipboard.writeText(''); swalDark.fire('Segurança', 'A captura do ecrã não é permitida.', 'error'); }
        });

        // VARIÁVEIS GLOBAIS DO ALUNO
        let alunoGlobal = null; 
        let listenerPerfil = null; 
        let questoesProva = []; 
        let respostasAluno = {}; 
        let configProvaGlobal = null;
        let tempoRestante = 0; 
        let timerInterval = null; 
        let advertenciasCola = 0; 
        let travadoParaSalvamento = false; 
        let exameIniciadoNestaSessao = false; 
        
        // Variáveis do MODO ROLA
        let questoesSessaoRola = []; 
        let questaoAtualRolaIndex = 0; 
        let alternativaSelecionadaRola = null; 
        let pontosGanhosNestaSessao = 0;

        // Variáveis da ACADEMIA DIGITAL (LMS)
        let todosCursosLoja = []; 
        let matriculasAluno = []; 
        let cursoAssistindo = null; 
        let matriculaAssistindo = null;
        let todasAulasFlat = []; 
        let aulaAtualIndex = 0;
        let questoesProvaCurso = []; 
        let respostasAlunoCurso = {}; 
        let timerIntervalCurso = null; 
        let tempoRestanteCurso = 0;


        // ============================================
        // FUNÇÕES DE INTERFACE E UTILITÁRIAS
        // ============================================
        window.desenharFaixaVisual = (faixa, targetId = 'visual-faixa-alvo') => {
            const container = document.getElementById(targetId);
            if(!container) return;
            if(!faixa) { container.innerHTML = ''; return; }

            const c_branca = '#ffffff'; const c_cinza = '#9ca3af'; const c_amarela = '#eab308';
            const c_laranja = '#ea580c'; const c_verde = '#16a34a'; const c_azul = '#2563eb';
            const c_roxa = '#7e22ce'; const c_marrom = '#5c2b07'; const c_preta = '#111827';

            let bgCSS = ''; 
            let ponteiraCSS = 'bg-black'; 

            switch(faixa) {
                case 'Branca': bgCSS = `background-color: ${c_branca};`; break;
                case 'Cinza e Branca': bgCSS = `background: linear-gradient(to bottom, ${c_cinza} 33%, ${c_branca} 33% 66%, ${c_cinza} 66%);`; break;
                case 'Cinza': bgCSS = `background-color: ${c_cinza};`; break;
                case 'Cinza e Preta': bgCSS = `background: linear-gradient(to bottom, ${c_cinza} 33%, ${c_preta} 33% 66%, ${c_cinza} 66%);`; break;
                case 'Amarela e Branca': bgCSS = `background: linear-gradient(to bottom, ${c_amarela} 33%, ${c_branca} 33% 66%, ${c_amarela} 66%);`; break;
                case 'Amarela': bgCSS = `background-color: ${c_amarela};`; break;
                case 'Amarela e Preta': bgCSS = `background: linear-gradient(to bottom, ${c_amarela} 33%, ${c_preta} 33% 66%, ${c_amarela} 66%);`; break;
                case 'Laranja e Branca': bgCSS = `background: linear-gradient(to bottom, ${c_laranja} 33%, ${c_branca} 33% 66%, ${c_laranja} 66%);`; break;
                case 'Laranja': bgCSS = `background-color: ${c_laranja};`; break;
                case 'Laranja e Preta': bgCSS = `background: linear-gradient(to bottom, ${c_laranja} 33%, ${c_preta} 33% 66%, ${c_laranja} 66%);`; break;
                case 'Verde e Branca': bgCSS = `background: linear-gradient(to bottom, ${c_verde} 33%, ${c_branca} 33% 66%, ${c_verde} 66%);`; break;
                case 'Verde': bgCSS = `background-color: ${c_verde};`; break;
                case 'Verde e Preta': bgCSS = `background: linear-gradient(to bottom, ${c_verde} 33%, ${c_preta} 33% 66%, ${c_verde} 66%);`; break;
                case 'Azul': bgCSS = `background-color: ${c_azul};`; break;
                case 'Roxa': bgCSS = `background-color: ${c_roxa};`; break;
                case 'Marrom': bgCSS = `background-color: ${c_marrom};`; break;
                case 'Preta': bgCSS = `background-color: ${c_preta};`; ponteiraCSS = 'bg-red-600 border-x-2 border-white'; break;
            }

            container.innerHTML = `<div class="h-8 w-full rounded shadow-[0_4px_15px_rgba(0,0,0,0.5)] border border-slate-700 flex overflow-hidden relative transform transition-transform hover:scale-105"><div class="flex-1" style="${bgCSS}; box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), inset 0 -3px 6px rgba(0,0,0,0.4);"></div><div class="w-12 ${ponteiraCSS} flex items-center justify-evenly px-0.5 shadow-[inset_0_2px_4px_rgba(255,255,255,0.2),_inset_0_-2px_4px_rgba(0,0,0,0.4)]"></div></div>`;
        };

        window.toggleSidebar = () => { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('mobile-overlay').classList.toggle('hidden'); };
        window.togglePlayerSidebar = () => { document.getElementById('player-sidebar').classList.toggle('translate-x-full'); document.getElementById('player-mobile-overlay').classList.toggle('hidden'); };
        window.toggleTema = () => { const html = document.documentElement; html.classList.toggle('light-mode'); localStorage.setItem('tema_bjj', html.classList.contains('light-mode') ? 'light' : 'dark'); };

        window.mudarAba = (evt, tabName) => {
            if(alunoGlobal?.status_exame_em_andamento && tabName !== 'sala-exame') { swalDark.fire('Bloqueado', 'Termine a sua prova primeiro!', 'warning'); return; }
            document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
            document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
            document.getElementById(tabName).classList.add("active");
            if(evt && evt.currentTarget) evt.currentTarget.classList.add("active");
            document.getElementById('titulo-pagina').innerText = evt ? evt.currentTarget.innerText.trim() : tabName;
            if(window.innerWidth < 768 && document.getElementById('sidebar').classList.contains('-translate-x-full') === false) window.toggleSidebar(); 
            
            if(tabName === 'ranking') window.carregarRanking();
            if(tabName === 'certificados') window.carregarCertificados();
            if(tabName === 'modo-rola') window.preencherFiltrosRola();
        };

        window.mudarSubAbaCursos = (id) => {
            document.getElementById('cursos-meus').classList.add('hidden'); document.getElementById('cursos-loja').classList.add('hidden');
            document.getElementById('btn-cursos-meus').className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-white transition-all";
            document.getElementById('btn-cursos-loja').className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-white transition-all";
            document.getElementById(id).classList.remove('hidden');
            document.getElementById('btn-' + id).className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-widest bg-neon text-slate-900 transition-all shadow-lg";
            if (id === 'cursos-loja') window.renderizarLojaCursos();
        };

        // ============================================
        // ATUALIZAÇÃO DA INTERFACE DO ALUNO
        // ============================================
        window.atualizarInterfaceAluno = () => {
            try {
                if(document.getElementById('aluno-nome')) document.getElementById('aluno-nome').innerText = alunoGlobal.nome || "Aluno"; 
                if(document.getElementById('dash-nome')) document.getElementById('dash-nome').innerText = alunoGlobal.nome ? alunoGlobal.nome.split(' ')[0] : "Aluno"; 
                if(document.getElementById('header-equipe')) document.getElementById('header-equipe').innerText = alunoGlobal.equipe_origem || 'Sem Equipe';
                
                if(document.getElementById('pf-nome')) document.getElementById('pf-nome').value = alunoGlobal.nome || ''; 
                if(document.getElementById('pf-email')) document.getElementById('pf-email').value = alunoGlobal.email || ''; 
                if(document.getElementById('pf-cpf')) document.getElementById('pf-cpf').value = alunoGlobal.cpf || ''; 
                if(document.getElementById('pf-equipe')) document.getElementById('pf-equipe').value = alunoGlobal.equipe_origem || '';
                if(document.getElementById('dash-pontos-rola')) document.getElementById('dash-pontos-rola').innerText = alunoGlobal.pontos_rola || 0;

                window.desenharFaixaVisual(alunoGlobal.faixa_atual || alunoGlobal.faixa || 'Branca', 'visual-faixa-sidebar');

                const preExame = document.getElementById('pre-exame-container'); 
                const exameBloqueado = document.getElementById('exame-bloqueado-container');
                
                if(preExame) preExame.classList.add('hidden'); 
                if(exameBloqueado) exameBloqueado.classList.add('hidden');
                
                if (alunoGlobal.status_vinculo !== 'ativo') {
                    if(exameBloqueado) {
                        exameBloqueado.classList.remove('hidden');
                        exameBloqueado.innerHTML = `<h2 class="text-2xl font-black text-white uppercase tracking-widest mb-2 mt-4">Aguardar Aprovação</h2><p class="text-sm text-slate-400">A sua conta está associada à equipa <b class="text-amber-500">${alunoGlobal.equipe_origem || 'Desconhecida'}</b>. Aguarde que o professor aprove a sua entrada.</p>`;
                    }
                    return;
                }

                if (alunoGlobal.status_exame_em_andamento) { 
                    if(questoesProva.length === 0 && !exameIniciadoNestaSessao) { window.recarregarProvaAposF5(); } 
                } else if (alunoGlobal.exame_habilitado) { 
                    if(preExame) preExame.classList.remove('hidden'); 
                    if(document.getElementById('lbl-faixa-alvo')) document.getElementById('lbl-faixa-alvo').innerText = alunoGlobal.faixa_exame || "Prova"; 
                    window.buscarConfigExamePrevia(alunoGlobal.faixa_exame); 
                } else { 
                    if(exameBloqueado) {
                        exameBloqueado.classList.remove('hidden'); 
                        exameBloqueado.innerHTML = `<h2 class="text-2xl font-black text-white uppercase tracking-widest mb-2 mt-4">Exame Bloqueado</h2><p class="text-sm text-slate-400">Não há exames de faixa agendados para si.</p>`; 
                    }
                }
            } catch(e) { console.error("Erro atualizar interface: ", e); }
        };

        // ============================================
        // MODO ROLA
        // ============================================
        window.preencherFiltrosRola = async () => {};
        
        window.iniciarRola = async () => {
            const nivel = document.getElementById('rola-nivel').value;
            const tema = document.getElementById('rola-tema').value;
            swalDark.fire({title: 'Buscando adversários...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});

            try {
                let constraints = [where("status", "==", "aprovada")];
                if (nivel !== 'todos') constraints.push(where("dificuldade", "==", parseInt(nivel)));
                if (tema !== 'todos') constraints.push(where("categoria", "==", tema));

                const qSnap = await getDocs(query(collection(db, "questoes"), ...constraints));
                let questoesGlobais = [];
                qSnap.forEach(d => { questoesGlobais.push({ id: d.id, ...d.data() }); });

                if (questoesGlobais.length === 0) { return swalDark.fire('Tatame Vazio', 'Nenhuma questão encontrada com estes filtros.', 'info'); }

                for (let i = questoesGlobais.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questoesGlobais[i], questoesGlobais[j]] = [questoesGlobais[j], questoesGlobais[i]];
                }

                questoesSessaoRola = questoesGlobais.slice(0, 10);
                questaoAtualRolaIndex = 0; pontosGanhosNestaSessao = 0; 
                document.getElementById('rola-pontos-sessao').innerText = "0";
                
                document.getElementById('rola-setup').classList.add('hidden'); 
                document.getElementById('rola-combate').classList.remove('hidden');
                
                window.renderizarQuestaoRola(); Swal.close();
            } catch(e) { swalDark.fire('Erro', e.message, 'error'); }
        };

        window.renderizarQuestaoRola = () => {
            if (questaoAtualRolaIndex >= questoesSessaoRola.length) { return window.encerrarRola(); }
            alternativaSelecionadaRola = null;
            const btnResponder = document.getElementById('btn-responder-rola'); 
            btnResponder.disabled = true;
            btnResponder.className = "w-full bg-slate-800 text-slate-400 font-black py-4 rounded-xl uppercase tracking-widest text-sm mt-8 transition-all cursor-not-allowed";
            btnResponder.innerText = "Escolha uma Opção";

            const q = questoesSessaoRola[questaoAtualRolaIndex];
            const pts = (q.dificuldade || 1) * 10;

            document.getElementById('rola-q-categoria').innerText = `${q.categoria || 'Geral'} - Questão ${questaoAtualRolaIndex + 1}/${questoesSessaoRola.length}`;
            document.getElementById('rola-q-pts').innerText = `Valendo ${pts} pts`;
            document.getElementById('rola-pergunta').innerText = q.pergunta;

            const divMidia = document.getElementById('rola-midia');
            if (q.url_imagem) { divMidia.innerHTML = `<img src="${q.url_imagem}" class="max-h-64 rounded-xl mx-auto border border-slate-700">`; divMidia.classList.remove('hidden'); } 
            else { divMidia.classList.add('hidden'); divMidia.innerHTML = ''; }

            const altsDiv = document.getElementById('rola-alternativas'); 
            let altsHtml = '';
            ['A', 'B', 'C', 'D'].forEach(letra => {
                if(q.alternativas[letra]) {
                    altsHtml += `<button onclick="window.selecionarAlternativaRola('${letra}')" id="opt-${letra}" class="option-btn w-full text-left p-4 rounded-xl text-slate-300 font-bold flex items-center gap-4"><span class="w-8 h-8 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center shrink-0">${letra}</span>${q.alternativas[letra]}</button>`;
                }
            });
            altsDiv.innerHTML = altsHtml;
        };

        window.selecionarAlternativaRola = (letra) => {
            alternativaSelecionadaRola = letra;
            ['A', 'B', 'C', 'D'].forEach(l => { 
                const btn = document.getElementById(`opt-${l}`); 
                if (l === letra) btn.classList.add('selected'); 
                else btn.classList.remove('selected'); 
            });
            const btnResponder = document.getElementById('btn-responder-rola'); 
            btnResponder.disabled = false;
            btnResponder.className = "w-full bg-neon text-slate-900 font-black py-4 rounded-xl uppercase tracking-widest text-sm mt-8 transition-all hover:scale-105 shadow-[0_0_15px_rgba(0,255,209,0.3)]"; 
            btnResponder.innerText = "Confirmar Golpe";
        };

        window.verificarRespostaRola = async () => {
            if(!alternativaSelecionadaRola) return;
            const q = questoesSessaoRola[questaoAtualRolaIndex]; 
            const acertou = alternativaSelecionadaRola === q.resposta_correta; 
            const ptsValendo = (q.dificuldade || 1) * 10;
            
            document.getElementById('btn-responder-rola').disabled = true; 
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

            const optCorretaBtn = document.getElementById(`opt-${q.resposta_correta}`); 
            const optEscolhidaBtn = document.getElementById(`opt-${alternativaSelecionadaRola}`);
            if(optCorretaBtn) { optCorretaBtn.style.backgroundColor = 'rgba(16, 185, 129, 0.2)'; optCorretaBtn.style.borderColor = '#10B981'; optCorretaBtn.style.color = '#10B981'; }
            if (!acertou && optEscolhidaBtn) { optEscolhidaBtn.style.backgroundColor = 'rgba(244, 63, 94, 0.2)'; optEscolhidaBtn.style.borderColor = '#F43F5E'; optEscolhidaBtn.style.color = '#F43F5E'; }

            if (acertou) {
                pontosGanhosNestaSessao += ptsValendo; 
                document.getElementById('rola-pontos-sessao').innerText = pontosGanhosNestaSessao;
                alunoGlobal.pontos_rola = (alunoGlobal.pontos_rola || 0) + ptsValendo; 
                updateDoc(doc(db, "alunos", alunoGlobal.id), { pontos_rola: alunoGlobal.pontos_rola });
            }
            try { await updateDoc(doc(db, "questoes", q.id), { vezes_utilizada: increment(1) }); } catch(e) {}

            setTimeout(() => { questaoAtualRolaIndex++; window.renderizarQuestaoRola(); }, 1800);
        };

        window.encerrarRola = () => { 
            swalDark.fire({ title: 'Fim de Treino!', text: `Você acumulou ${pontosGanhosNestaSessao} pontos nesta sessão.`, icon: 'success', confirmButtonText: 'Oss!' }).then(() => { 
                document.getElementById('rola-combate').classList.add('hidden'); 
                document.getElementById('rola-setup').classList.remove('hidden'); 
            }); 
        };

        // ============================================
        // RANKING
        // ============================================
        window.carregarRanking = async () => {
            const divLista = document.getElementById('lista-ranking');
            if(!divLista) return;
            divLista.innerHTML = '<div class="p-8 text-center"><div class="w-8 h-8 border-4 border-slate-700 border-t-neon rounded-full animate-spin mx-auto mb-2"></div><p class="text-slate-500 text-xs">Buscando cascas grossas...</p></div>';
            try {
                const qRanking = query(collection(db, "alunos"), orderBy("pontos_rola", "desc"), limit(20)); 
                const snap = await getDocs(qRanking);
                let html = ''; let posicao = 1;
                
                snap.forEach(d => {
                    const a = d.data(); const pts = a.pontos_rola || 0; 
                    let badge = `<span class="text-sm font-black text-slate-500 w-6 text-center">${posicao}º</span>`; 
                    let styleExtra = "hover:bg-slate-800/30";
                    
                    if (posicao === 1) { badge = '🥇'; styleExtra = "bg-amber-500/10 border-l-4 border-amber-500"; }
                    if (posicao === 2) { badge = '🥈'; styleExtra = "bg-slate-300/10 border-l-4 border-slate-300"; }
                    if (posicao === 3) { badge = '🥉'; styleExtra = "bg-amber-700/10 border-l-4 border-amber-700"; }
                    if (d.id === alunoGlobal.id) { styleExtra += " border border-neon/50 bg-neon/5"; }

                    html += `<div class="p-4 flex items-center justify-between transition-colors ${styleExtra}"><div class="flex items-center gap-4"><div class="text-xl w-8 text-center">${badge}</div><div><p class="text-sm font-bold ${d.id === alunoGlobal.id ? 'text-neon' : 'text-white'}">${a.nome || 'Guerreiro Anônimo'} ${d.id === alunoGlobal.id ? '(Você)' : ''}</p><p class="text-[10px] text-slate-500 uppercase tracking-widest">${a.equipe_origem || 'Equipe'}</p></div></div><div class="text-right"><span class="bg-slate-900 border border-slate-700 text-amber-500 px-3 py-1 rounded-lg text-xs font-black">${pts} pts</span></div></div>`;
                    posicao++;
                });
                divLista.innerHTML = html || '<div class="p-8 text-center text-slate-500 text-sm">O tatame ainda está vazio. Seja o primeiro a pontuar!</div>';
            } catch(e) { console.error(e); divLista.innerHTML = `<div class="p-8 text-center text-rose-500 text-sm">Erro ao carregar o ranking.</div>`; }
        };

        // ============================================
        // ACADEMIA DIGITAL (EAD)
        // ============================================
        window.carregarLojaEInscricoes = async () => {
            try {
                const snapCursos = await getDocs(query(collection(db, "cursos_teoricos"), where("status", "==", "publicado")));
                todosCursosLoja = []; snapCursos.forEach(d => todosCursosLoja.push({ id_curso: d.id, ...d.data() }));
                
                const snapMatriculas = await getDocs(query(collection(db, "matriculas"), where("aluno_id", "==", alunoGlobal.id)));
                matriculasAluno = []; snapMatriculas.forEach(d => matriculasAluno.push({ id_matricula: d.id, ...d.data() }));
                
                window.renderizarAcademiaDigital();
            } catch(e) { console.error("Erro EAD:", e); }
        };

        window.renderizarAcademiaDigital = () => {
            const gridMeus = document.getElementById('grid-meus-cursos'); 
            const gridLoja = document.getElementById('grid-loja-cursos'); 
            const gridDashboard = document.getElementById('grid-dashboard-loja');
            
            let htmlMeus = '', htmlLoja = ''; 
            const cursosMatriculadosIds = matriculasAluno.map(m => m.curso_id);

            todosCursosLoja.forEach(curso => {
                const isMatriculado = cursosMatriculadosIds.includes(curso.id_curso);
                const precoFormatado = curso.preco && curso.preco > 0 ? `R$ ${curso.preco.toFixed(2)}` : "Gratuito";
                const badge = curso.preco && curso.preco > 0 ? `<span class="badge-paid">Premium</span>` : `<span class="badge-free">Aberto</span>`;
                
                const cardLoja = `
                <div class="bg-panelbg border border-slate-700 p-6 rounded-2xl flex flex-col justify-between hover:border-neon transition-all">
                    <div>
                        <div class="flex justify-between items-start mb-4">${badge} <p class="font-mono font-bold text-sm text-neon">${precoFormatado}</p></div>
                        <h3 class="font-black text-lg mb-1">${curso.titulo}</h3>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest mb-4">Prof: ${curso.professor_nome}</p>
                    </div>
                    ${isMatriculado ? 
                        `<button onclick="window.mudarAba({currentTarget: document.querySelectorAll('.nav-item')[1]}, 'academia-digital'); window.mudarSubAbaCursos('cursos-meus');" class="w-full bg-slate-800 py-3 rounded-xl text-xs font-bold uppercase text-slate-400 hover:text-white transition-colors border border-slate-600">Continuar Estudos</button>` : 
                        `<button onclick="window.iniciarCheckout('${curso.id_curso}', '${curso.titulo}', ${curso.preco || 0})" class="w-full bg-neon hover:bg-white py-3 rounded-xl text-xs font-bold uppercase tracking-widest text-slate-900 transition-colors shadow-lg">Aceder ao Curso</button>`
                    }
                </div>`;
                htmlLoja += cardLoja;

                if (isMatriculado) {
                    const mat = matriculasAluno.find(m => m.curso_id === curso.id_curso); 
                    const pct = mat.progresso || 0;
                    htmlMeus += `
                    <div class="bg-gradient-to-t from-slate-900 to-slate-800 border border-slate-700 p-6 rounded-2xl flex flex-col justify-between relative overflow-hidden group hover:border-neon transition-all cursor-pointer" onclick="window.abrirPlayerLMS('${curso.id_curso}')">
                        <div class="absolute top-0 left-0 w-full h-1.5 bg-slate-800"><div class="h-full bg-neon shadow-[0_0_10px_rgba(0,255,209,0.5)]" style="width: ${pct}%"></div></div>
                        <div><h3 class="font-black text-lg mt-2 mb-1 group-hover:text-neon transition-colors">${curso.titulo}</h3><p class="text-[10px] text-slate-500 uppercase tracking-widest mb-6">Progresso: ${pct}%</p></div>
                        <button class="w-full bg-slate-800 border border-slate-600 py-3 rounded-xl text-xs font-bold uppercase tracking-widest group-hover:bg-neon group-hover:text-slate-900 transition-all flex items-center justify-center gap-2">Continuar Curso</button>
                    </div>`;
                }
            });
            
            if(gridLoja) gridLoja.innerHTML = htmlLoja || `<p class="text-slate-500 col-span-full text-center py-6">Nenhum curso disponível na loja.</p>`; 
            if(gridDashboard) gridDashboard.innerHTML = htmlLoja || `<p class="text-slate-500 col-span-full text-center py-6">Nenhum curso novo disponível.</p>`; 
            if(gridMeus) gridMeus.innerHTML = htmlMeus || `<div class="col-span-full text-center py-10 bg-slate-900 border border-slate-800 rounded-2xl"><p class="text-sm text-slate-400">Não possui inscrições.</p></div>`;
            
            if(document.getElementById('dash-cursos-qtd')) document.getElementById('dash-cursos-qtd').innerText = matriculasAluno.length;
        };

        window.iniciarCheckout = (cursoId, titulo, preco) => {
            if (preco === 0) { window.efetivarMatricula(cursoId); return; }
            swalDark.fire({ 
                title: 'Checkout Seguro', 
                html: `<div class="text-left bg-slate-900 p-4 rounded-xl border border-slate-700 mb-4"><p class="text-xs text-slate-400 uppercase tracking-widest mb-1">Compra</p><p class="font-black text-white">${titulo}</p><p class="text-xl font-black text-neon mt-2">R$ ${preco.toFixed(2)}</p></div><div class="flex gap-2"><button id="btn-pix" class="flex-1 bg-neon text-slate-900 py-3 rounded-lg font-bold text-xs uppercase">PIX</button><button class="flex-1 bg-slate-800 text-slate-400 py-3 rounded-lg font-bold text-xs uppercase cursor-not-allowed">Cartão</button></div><div id="area-pix" class="hidden mt-4 bg-white p-4 rounded-xl"><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=00020101021126360014br.gov.bcb.pix0114+5521999999999" class="mx-auto mb-2 w-32 h-32"><p class="text-[10px] text-slate-600 font-bold uppercase mb-2">A aguardar Pagamento...</p><button id="btn-simular-pgto" class="w-full bg-slate-200 text-slate-800 py-2 rounded font-bold text-xs uppercase hover:bg-slate-300">(Simular API)</button></div>`, 
                showConfirmButton: false, showCloseButton: true, 
                didOpen: () => { 
                    document.getElementById('btn-pix').addEventListener('click', () => { document.getElementById('area-pix').classList.remove('hidden'); }); 
                    document.getElementById('btn-simular-pgto').addEventListener('click', () => { window.efetivarMatricula(cursoId); }); 
                } 
            });
        };

        window.efetivarMatricula = async (cursoId) => {
            swalDark.fire({title: 'A libertar...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
            try { 
                await addDoc(collection(db, "matriculas"), { 
                    aluno_id: alunoGlobal.id, curso_id: cursoId, data_inscricao: serverTimestamp(), progresso: 0, aulas_concluidas: [] 
                }); 
                swalDark.fire({title: 'Sucesso!', text: 'Curso adicionado.', icon: 'success'}).then(() => { 
                    window.carregarLojaEInscricoes(); window.mudarAba(null, 'academia-digital'); window.mudarSubAbaCursos('cursos-meus'); 
                }); 
            } catch(e) { swalDark.fire('Erro', e.message, 'error'); }
        };

        // PLAYER LMS
        window.abrirPlayerLMS = (cursoId) => {
            cursoAssistindo = todosCursosLoja.find(c => c.id_curso === cursoId); 
            matriculaAssistindo = matriculasAluno.find(m => m.curso_id === cursoId);
            todasAulasFlat = []; 
            if(cursoAssistindo.modulos) { 
                cursoAssistindo.modulos.forEach((mod, mIdx) => { 
                    mod.aulas.forEach((aula, aIdx) => { 
                        todasAulasFlat.push({ ...aula, mIndex: mIdx, aIndex: aIdx, modTitulo: mod.titulo }); 
                    }); 
                }); 
            }
            document.body.style.overflow = 'hidden'; 
            document.getElementById('player-studio').classList.remove('hidden'); 
            document.getElementById('player-curso-titulo').innerText = cursoAssistindo.titulo;
            window.renderizarSidebarModulos();
            let aulaParaAbrir = todasAulasFlat.find(a => !matriculaAssistindo.aulas_concluidas.includes(`${cursoAssistindo.id_curso}_${a.titulo}`)); 
            if (!aulaParaAbrir && todasAulasFlat.length > 0) aulaParaAbrir = todasAulasFlat[0]; 
            if (aulaParaAbrir) window.carregarAulaNoPlayer(aulaParaAbrir); 
            else document.getElementById('player-aula-titulo').innerText = "Nenhuma aula cadastrada.";
        };

        window.fecharPlayer = () => { 
            if (timerIntervalCurso) clearInterval(timerIntervalCurso); 
            document.getElementById('player-studio').classList.add('hidden'); 
            document.body.style.overflow = 'auto'; 
            document.getElementById('video-container').innerHTML = ""; 
            document.getElementById('pdf-container').innerHTML = ""; 
            cursoAssistindo = null; matriculaAssistindo = null; 
            window.carregarLojaEInscricoes(); 
            if(!document.getElementById('player-sidebar').classList.contains('translate-x-full')) { window.togglePlayerSidebar(); }
        };

        window.navegarAula = (direcao) => { 
            const novaIndex = aulaAtualIndex + direcao; 
            if (novaIndex >= 0 && novaIndex < todasAulasFlat.length) { 
                window.carregarAulaNoPlayer(todasAulasFlat[novaIndex]); 
                const playerContainer = document.getElementById('player-scroll-container'); 
                if(playerContainer) playerContainer.scrollTo({top: 0, behavior: 'smooth'}); 
            } 
        };

        window.renderizarSidebarModulos = () => {
            const container = document.getElementById('player-lista-modulos'); 
            const arrayConcluidas = matriculaAssistindo.aulas_concluidas || [];
            let totalAulas = 0; let totalConcluidas = 0; let html = ''; 
            if(!cursoAssistindo.modulos) return;

            cursoAssistindo.modulos.forEach((mod, mIdx) => {
                html += `<div class="mb-4"><h5 class="text-sm font-black text-white mb-2 ml-2 uppercase tracking-widest">${mIdx+1}. ${mod.titulo}</h5><div class="space-y-1 pl-2 border-l border-slate-700 ml-3">`;
                mod.aulas.forEach((aula, aIdx) => {
                    totalAulas++; 
                    const idUnico = `${cursoAssistindo.id_curso}_${aula.titulo}`; 
                    const foiVista = arrayConcluidas.includes(idUnico); 
                    if(foiVista) totalConcluidas++;
                    html += `<button onclick='window.carregarAulaNoPlayer(${JSON.stringify(aula)})' class="w-full text-left flex items-start gap-3 p-2 hover:bg-slate-800/80 rounded-lg transition-colors group"><span class="text-xs ${foiVista ? 'text-slate-300 font-bold' : 'text-slate-400'} group-hover:text-white mt-0.5">${aula.titulo}</span></button>`;
                });
                html += `</div></div>`;
            });
            
            const progressoAtual = totalAulas > 0 ? Math.round((totalConcluidas / totalAulas) * 100) : 0;
            
            if(cursoAssistindo.questoes_ids && cursoAssistindo.questoes_ids.length > 0) {
                const isLiberado = progressoAtual === 100;
                html += `<div class="mt-6 border-t border-slate-700/50 pt-4"><button onclick='window.abrirExameDoCurso()' class="w-full text-left flex items-center gap-3 p-3 rounded-lg transition-colors group"><span class="text-sm font-black uppercase tracking-widest ${isLiberado ? 'text-neon' : 'text-slate-600'} mt-0.5">Exame Final</span></button>${!isLiberado ? `<p class="text-[9px] text-slate-500 ml-9 mt-1">Conclua 100% das aulas para libertar.</p>` : ``}</div>`;
            }
            container.innerHTML = html; 
            document.getElementById('barra-progresso').style.width = progressoAtual + "%"; 
            document.getElementById('lbl-progresso').innerText = progressoAtual;
        };

        window.carregarAulaNoPlayer = (aulaObj) => {
            if (window.innerWidth < 768 && !document.getElementById('player-sidebar').classList.contains('translate-x-full')) { window.togglePlayerSidebar(); }
            document.getElementById('exame-curso-area').classList.add('hidden');
            const videoArea = document.getElementById('video-area'); 
            const pdfArea = document.getElementById('pdf-area'); 
            const textArea = document.getElementById('text-area');

            aulaAtualIndex = todasAulasFlat.findIndex(a => a.titulo === aulaObj.titulo);

            const btnPrev = document.getElementById('btn-aula-anterior'); 
            const btnNext = document.getElementById('btn-proxima-aula');
            if(aulaAtualIndex > 0) { btnPrev.classList.remove('hidden'); } else { btnPrev.classList.add('hidden'); }
            if(aulaAtualIndex < todasAulasFlat.length - 1) { btnNext.classList.remove('hidden'); } else { btnNext.classList.add('hidden'); }

            const btnConcluir = document.getElementById('btn-concluir-aula');
            document.getElementById('player-aula-titulo').innerText = aulaObj.titulo; 
            document.getElementById('player-aula-autor').innerText = `Por: ${cursoAssistindo.professor_nome || 'Professor'}`;
            document.getElementById('player-aula-desc').innerHTML = aulaObj.descricao || "Sem material complementar em texto.";
            
            videoArea.classList.add('hidden'); document.getElementById('video-container').innerHTML = ""; 
            pdfArea.classList.add('hidden'); document.getElementById('pdf-container').innerHTML = "";
            textArea.classList.add('hidden'); 

            if (aulaObj.url_pdf && aulaObj.url_pdf.trim() !== "") {
                pdfArea.classList.remove('hidden'); textArea.classList.remove('hidden'); 
                document.getElementById('pdf-container').innerHTML = `<iframe src="${aulaObj.url_pdf}" width="100%" height="100%" style="border:none; border-radius: 8px; background: #fff;"></iframe>`;
            } else if (aulaObj.url_video && aulaObj.url_video.trim() !== "") {
                videoArea.classList.remove('hidden'); textArea.classList.remove('hidden'); 
                let embedUrl = aulaObj.url_video;

            const notaPercentual = total > 0 ? Math.round((acertos / total) * 100) : 0; 
            const notaCorte = configProvaGlobal ? (configProvaGlobal.nota_corte || 70) : 70; 
            const passou = (!foiAnulada && notaPercentual >= notaCorte);
            
            try {
                // ✅ CORREÇÃO: Adicionado equipe_id
                await addDoc(collection(db, "resultados"), { 
                    aluno_id: alunoGlobal.id, 
                    aluno_nome: alunoGlobal.nome, 
                    exame_nome: alunoGlobal.faixa_exame, 
                    equipe_id: alunoGlobal.equipe_id,
                    data_execucao: serverTimestamp(), 
                    nota: notaPercentual, 
                    acertos: acertos, 
                    total_questoes: total, 
                    status: passou ? 'aprovado' : 'reprovado', 
                    anulada_por_cola: foiAnulada 
                });
                
                if (passou) {
                    const hashUnico = `BJJEXAMES-${new Date().getFullYear()}-${Math.floor(Math.random()*9999).toString().padStart(4,'0')}`; 
                    await setDoc(doc(db, "certificados", hashUnico), { 
                        hash: hashUnico, aluno_id: alunoGlobal.id, nome_aluno: alunoGlobal.nome, faixa_alvo: alunoGlobal.faixa_exame, 
                        nota_final: notaPercentual, emitido_em: serverTimestamp(), equipe_origem: alunoGlobal.equipe_origem 
                    }); 
                    await updateDoc(doc(db, "alunos", alunoGlobal.id), { 
                        status_exame_em_andamento: false, exame_habilitado: false, status_exame: 'aprovado', faixa_atual: alunoGlobal.faixa_exame 
                    }); 
                    swalDark.fire('Parabéns!', `Aprovado com ${notaPercentual}%.`, 'success').then(() => { 
                        localStorage.setItem('direcionar_certificados', 'true'); window.location.reload(); 
                    });
                } else {
                    await updateDoc(doc(db, "alunos", alunoGlobal.id), { 
                        status_exame_em_andamento: false, exame_habilitado: false, status_exame: 'reprovado' 
                    }); 
                    const mensagem = foiAnulada ? 'Prova anulada por violação de segurança.' : `Nota: ${notaPercentual}%. Mínimo: ${notaCorte}%.`;
                    swalDark.fire('Reprovado', mensagem, 'error').then(() => window.location.reload());
                }
            } catch (error) { 
                console.error("Erro ao salvar resultado:", error);
                swalDark.fire('Erro', 'Ocorreu um erro no servidor. Contate o suporte.', 'error'); 
                loader.style.opacity = '0'; setTimeout(() => loader.classList.add('hidden'), 500); 
            }
        };

        // ============================================
        // CERTIFICADOS
        // ============================================
        window.carregarCertificados = async () => {
            if(!alunoGlobal) return; 
            const listDiv = document.getElementById('lista-meus-certificados'); 
            listDiv.innerHTML = "<p class='text-neon text-sm animate-pulse'>A procurar certificados...</p>";
            try { 
                const snap = await getDocs(query(collection(db, "certificados"), where("aluno_id", "==", alunoGlobal.id))); 
                if(snap.empty) { listDiv.innerHTML = `<div class="bg-cardbg border border-slate-700/50 p-6 rounded-2xl text-center"><p class="text-slate-400 text-sm">Sem certificados emitidos.</p></div>`; return; } 
                let html = ''; 
                snap.forEach(docCert => { 
                    const c = docCert.data(); 
                    const dataEmi = c.emitido_em ? new Date(c.emitido_em.seconds * 1000).toLocaleDateString('pt-PT') : 'Hoje'; 
                    const eqOrigem = c.equipe_origem || "Equipa Oficial"; 
                    html += `<div class="bg-gradient-to-r from-panelbg to-cardbg border border-neon/30 p-6 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4 hover:scale-[1.01]"><div class="flex-1"><h4 class="text-xl font-black text-neon uppercase tracking-widest">${c.faixa_alvo}</h4><p class="text-sm text-slate-300 mt-1">Concluído a: <b class="text-white">${dataEmi}</b> | Nota: <b class="text-white">${c.nota_final}%</b></p></div><button onclick="window.gerarPDF('${c.nome_aluno}', '${c.faixa_alvo}', '${dataEmi}', '${c.nota_final}', '${c.hash}', '${eqOrigem}')" class="bg-neon text-slate-900 px-6 py-4 rounded-xl font-black text-xs uppercase hover:bg-white transition-all shadow-lg flex items-center gap-2"><svg viewBox="0 0 24 24" class="w-4 h-4 fill-current"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Imprimir PDF</button></div>`; 
                }); 
                listDiv.innerHTML = html; 
            } catch (err) { listDiv.innerHTML = "<p class='text-rose-500 text-sm'>Erro ao carregar os certificados.</p>"; }
        };

        window.gerarPDF = (nome, faixa, data, nota, hash, equipe) => {
            document.getElementById('cert-nome').innerText = nome; 
            document.getElementById('cert-faixa').innerText = faixa; 
            document.getElementById('cert-data').innerText = data; 
            document.getElementById('cert-nota').innerText = nota + '%'; 
            document.getElementById('cert-hash').innerText = hash; 
            document.getElementById('cert-equipe-nome').innerText = equipe; 
            document.getElementById('cert-equipe-rodape').innerText = equipe; 
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(`https://bjjdigital.com.br/validar?codigo=${hash}`)}`; 
            document.getElementById('cert-qrcode').src = qrImageUrl; 
            const element = document.getElementById('molde-certificado'); 
            const opt = { margin: 0, filename: `Certificado_${faixa}_${nome}.pdf`, image: { type: 'jpeg', quality: 1 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' }, jsPDF: { unit: 'px', format: [1122, 793], orientation: 'landscape' } }; 
            swalDark.fire({ title: 'A gerar PDF...', text: 'Aguarde um instante.', allowOutsideClick: false, didOpen: () => Swal.showLoading()}); 
            setTimeout(() => { html2pdf().set(opt).from(element).save().then(() => Swal.close()); }, 1000); 
        };

        // ============================================
        // PERFIL
        // ============================================
        window.salvarMeuPerfil = async (e) => { 
            e.preventDefault(); 
            const btn = document.getElementById('btn-save-profile'); 
            btn.innerText = "A guardar..."; btn.disabled = true; 
            try { 
                await updateDoc(doc(db, "alunos", alunoGlobal.id), { nome: document.getElementById('pf-nome').value.toUpperCase() }); 
                swalDark.fire('Salvo!', 'Dados atualizados.', 'success'); 
            } catch(err) { swalDark.fire('Erro', err.message, 'error'); } 
            finally { btn.innerText = "Atualizar Nome"; btn.disabled = false; } 
        };

        window.fazerLogout = () => signOut(auth).then(() => window.location.href = "login.html");
        
        // ============================================
        // INICIALIZAÇÃO DO FIREBASE
        // ============================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if(localStorage.getItem('direcionar_certificados') === 'true') { 
                    localStorage.removeItem('direcionar_certificados'); 
                    setTimeout(() => document.getElementById('btn-menu-certificados').click(), 200); 
                }
                
                listenerPerfil = onSnapshot(doc(db, "alunos", user.uid), (docSnap) => {
                    if (travadoParaSalvamento) return; 
                    if (docSnap.exists()) {
                        alunoGlobal = { id: user.uid, ...docSnap.data() };
                        if(alunoGlobal.pontos_rola === undefined) alunoGlobal.pontos_rola = 0;
                        
                        try {
                            window.atualizarInterfaceAluno(); 
                            window.carregarLojaEInscricoes(); 
                            window.carregarRanking();
                        } catch(e) { console.error("Erro na carga de dados:", e); }

                        setTimeout(() => { 
                            const loader = document.getElementById('loader-tela');
                            if(loader) { loader.style.opacity = '0'; setTimeout(() => loader.classList.add('hidden'), 500); }
                        }, 500);
                    } else { window.location.href = "login.html"; }
                });
            } else { window.location.href = "login.html"; }
        });
    </script>
</body>
</html>
