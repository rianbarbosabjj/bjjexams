name: Marco 8 RC regression

on:
  push:
    branches:
      - feature/marco8-ops-console
  pull_request:
    branches:
      - develop-v1.2

permissions:
  contents: read

concurrency:
  group: marco8-rc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: marco8-rc-133
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCLOUD_PROJECT: bjj-exams-staging
      GOOGLE_CLOUD_PROJECT: bjj-exams-staging
      CI: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: Verify execution boundary
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = 'bjj-exams-staging'
          test "$GOOGLE_CLOUD_PROJECT" = 'bjj-exams-staging'
          test "$(node -v)" = 'v22.23.2'
          node --check functions/main.js
          node --check functions/index.js
      - name: Install locked test dependencies
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Marco 8 regression (88 tests)
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find tests -maxdepth 1 -type f -name 'marco8-*.test.js' | LC_ALL=C sort)
          if [ "${#scripts[@]}" -ne 88 ]; then
            echo "Unexpected Marco 8 test manifest count: ${#scripts[@]}/88"
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "RUN $script"
            node "$script"
          done
          echo 'RC_MARCO8_REGRESSION=88/88'
      - name: Prior marcos regression (45 tests)
        run: |
          set -euo pipefail
          scripts=(
            tests/admin-financial-ops-entry-v1_2.test.js
            tests/admin-financial-ops-loader-v1_2.test.js
            tests/belt-exam-admin-financial-read-contract-v1_2.test.js
            tests/belt-exam-checkout-contract-v1_2.test.js
            tests/belt-exam-execution-frontend-v1_2.test.js
            tests/belt-exam-frontend-contract-v1_2.test.js
            tests/belt-exam-read-contract-v1_2.test.js
            tests/belt-exam-reversal-admin-contract-v1_2.test.js
            tests/belt-exam-reversal-contract-v1_2.test.js
            tests/belt-exam-webhook-contract-v1_2.test.js
            tests/course-admin-ui-v1_2.test.js
            tests/course-consumption-domain-v1_2.test.js
            tests/course-consumption-workflow-v1_2.test.js
            tests/course-content-api-v1_2.test.js
            tests/course-content-domain-v1_2.test.js
            tests/course-content-functions-v1_2.test.js
            tests/course-content-ui-v1_2.test.js
            tests/course-enrollment-domain-v1_2.test.js
            tests/course-enrollment-workflow-v1_2.test.js
            tests/course-exception-review-moderator-fixture-v1_2.test.js
            tests/course-hybrid-moderation-workflow-v1_2.test.js
            tests/course-instructor-handler-v1_2.test.js
            tests/course-moderation-policy-v1_2.test.js
            tests/course-moderation-provider-gemini-v1_2.test.js
            tests/course-moderation-ui-v1_2.test.js
            tests/course-price-mask-v1_2.test.js
            tests/course-progress-domain-v1_2.test.js
            tests/course-progress-workflow-v1_2.test.js
            tests/course-public-ui-v1_2.test.js
            tests/course-publication-fingerprint-workflow-v1_2.test.js
            tests/course-publication-snapshot-v1_2.test.js
            tests/course-purchase-api-v1_2.test.js
            tests/course-purchase-ui-v1_2.test.js
            tests/course-review-state-v1_2.test.js
            tests/course-student-api-v1_2.test.js
            tests/course-student-panel-integration-v1_2.test.js
            tests/course-student-ui-v1_2.test.js
            tests/exam-certificate-public-frontend-v1_2.test.js
            tests/exam-firestore-rules-v1_2.test.js
            tests/financial-admin-firestore-rules-v1_2.test.js
            tests/financial-checkout-firestore-rules-v1_2.test.js
            tests/financial-firestore-rules-v1_2.test.js
            tests/financial-ops-admin-bootstrap-v1_2.test.js
            tests/financial-ops-ui-v1_2.test.js
            tests/login-runtime-v1_2.test.js
          )
          if [ "${#scripts[@]}" -ne 45 ]; then
            echo "Unexpected prior test manifest count: ${#scripts[@]}/45"
            exit 1
          fi
          for script in "${scripts[@]}"; do
            test -f "$script" || { echo "Missing: $script"; exit 1; }
            echo "RUN $script"
            node "$script"
          done
          echo 'RC_PRIOR_MARCO_REGRESSION=45/45'
          echo 'RC_CONSOLIDATED_REGRESSION=133/133'
      - name: Staging hosting allow-list contract (no deploy)
        run: |
          set -euo pipefail
          node scripts/build-staging-hosting-v1_2.js
          node tests/staging-hosting-artifact-v1_2.test.js
          echo 'PRODUCTION_DEPLOY=NOT_RUN'
          echo 'STAGING_DEPLOY=NOT_RUN'
      - name: Marco 9 security contract (no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: node tests/marco9-security-baseline-v1_2.test.js
      - name: Marco 9 App Check inventory contract (no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          node scripts/inventory-app-check-v1_2.js
          node tests/marco9-app-check-inventory-v1_2.test.js
      - name: Marco 9 App Check client bridge (no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          node --check js/firebase-runtime-v1_2.js
          node tests/marco9-app-check-client-bridge-v1_2.test.js
      - name: Marco 9 staging App Check SDK bootstrap (no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          node --check js/firebase-runtime-v1_2.js
          node tests/marco9-app-check-sdk-staging-v1_2.test.js
      - name: Marco 9 App Check observability tooling (offline only)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          node --check scripts/analyze-appcheck-staging-logs-v1_2.js
          node tests/marco9-app-check-observability-v1_2.test.js
          echo 'APP_CHECK_REAL_STAGING_METRICS=NOT_COLLECTED'
          echo 'APP_CHECK_ENFORCEMENT=NOT_ENABLED'
      - name: Marco 9 staging App Check public key artifact preflight (no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          node --check scripts/prepare-staging-appcheck-sitekey-v1_2.js
          node tests/marco9-appcheck-hosting-injection-v1_2.test.js
          echo 'APP_CHECK_REAL_SITE_KEY=NOT_VERIFIED'
          echo 'APP_CHECK_STAGING_DEPLOY=NOT_RUN'
          echo 'APP_CHECK_ENFORCEMENT=NOT_ENABLED'
      - name: Marco 9 rate-limit core atomic unit tests (no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          node --check functions/src/security/rate-limit-core.js
          node tests/marco9-rate-limit-core-v1_2.test.js
          echo 'RATE_LIMIT_BACKEND_ENFORCEMENT=NOT_ENABLED'
          echo 'STAGING_DEPLOY=NOT_RUN'
          echo 'PRODUCTION_ACCESS=NOT_RUN'
      - name: Java 21 for isolated Firestore Emulator
        if: startsWith(github.head_ref, 'feature/marco9-')
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Marco 9 real Firestore emulator transactions (demo-only, no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        env:
          GCLOUD_PROJECT: demo-bjj-exams-rate-limit
          GOOGLE_CLOUD_PROJECT: demo-bjj-exams-rate-limit
          FIREBASE_PROJECT_ID: demo-bjj-exams-rate-limit
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = 'demo-bjj-exams-rate-limit'
          test "$GOOGLE_CLOUD_PROJECT" = 'demo-bjj-exams-rate-limit'
          test "$FIREBASE_PROJECT_ID" = 'demo-bjj-exams-rate-limit'
          node --check tests/marco9-rate-limit-emulator-v1_2.test.js
          npm exec --yes --package=firebase-tools@14.27.0 -- firebase emulators:exec --only firestore --project demo-bjj-exams-rate-limit "node tests/marco9-rate-limit-emulator-v1_2.test.js"
          echo 'FIRESTORE_EMULATOR_PROJECT=demo-bjj-exams-rate-limit'
          echo 'RATE_LIMIT_BACKEND_ENFORCEMENT=NOT_ENABLED'
          echo 'CLOUD_DEPLOY=NOT_RUN'
      - name: Marco 9 admin-context optional rate limit wiring (off by default)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          node --check functions/main.js
          node --check functions/src/admin/admin-context-functions.js
          node tests/marco9-rate-limit-admin-context-v1_2.test.js
          echo 'ADMIN_CONTEXT_RATE_LIMIT=DISABLED'
          echo 'RATE_LIMIT_SECRET_PROVISION=NOT_RUN'
          echo 'FIRESTORE_STAGING_MUTATION=NOT_RUN'
          echo 'PRODUCTION_ACCESS=NOT_RUN'
      - name: Marco 9 HMAC TTL quota calibration preflight (offline only)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node --check scripts/preflight-rate-limit-staging-v1_2.js
          node --check scripts/analyze-rate-limit-calibration-v1_2.js
          node scripts/preflight-rate-limit-staging-v1_2.js
          node tests/marco9-rate-limit-staging-readiness-v1_2.test.js
          echo 'RATE_LIMIT_HMAC_SECRET=NOT_PROVISIONED'
          echo 'RATE_LIMIT_FIRESTORE_TTL=NOT_APPLIED'
          echo 'RATE_LIMIT_STAGING_SAMPLES=NOT_COLLECTED'
          echo 'RATE_LIMIT_ENFORCEMENT=NOT_ENABLED'
          echo 'CLOUD_DEPLOY=NOT_RUN'
      - name: Marco 9 CSP staging static inventory (no headers, no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node --check scripts/inventory-csp-staging-v1_2.js
          node scripts/inventory-csp-staging-v1_2.js
          node tests/marco9-csp-inventory-v1_2.test.js
          echo 'CSP_REPORT_ONLY=CONFIGURED_NOT_DEPLOYED'
          echo 'CSP_ENFORCEMENT=NOT_ENABLED'
          echo 'CSP_DEPLOY=NOT_RUN'
      - name: Marco 9 CSP staging report-only contract (no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node tests/marco9-csp-report-only-v1_2.test.js
          echo 'CSP_REPORT_ONLY=CONFIGURED_NOT_DEPLOYED'
          echo 'CSP_REPORT_COLLECTION=NOT_CONFIGURED'
          echo 'CSP_ENFORCEMENT=NOT_ENABLED'
          echo 'STAGING_DEPLOY=NOT_RUN'
          echo 'PRODUCTION_ACCESS=NOT_RUN'
      - name: Marco 9 STRIDE and supply chain offline security (no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node --check scripts/preflight-supply-chain-v1_2.js
          node scripts/preflight-supply-chain-v1_2.js
          node tests/marco9-threat-supply-v1_2.test.js
          echo 'MARCO9_LIVE_VULNERABILITY_AUDIT=NOT_RUN'
          echo 'MARCO9_STRIDE_STAGING_PENTEST=NOT_RUN'
      - name: Marco 9 webhook error privacy and logging (no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node --check functions/index.js
          node --check functions/src/finance/financial-webhook-functions.js
          node --check functions/src/security/operational-error-sanitizer.js
          node tests/marco9-privacy-logging-v1_2.test.js
          echo 'LOG_RETENTION_POLICY=UNAPPROVED'
          echo 'PRODUCTION_ACCESS=NOT_RUN'
          echo 'CLOUD_DEPLOY=NOT_RUN'
      - name: Marco 9 recovery and load synthetic demo Firestore tests (no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        env:
          GCLOUD_PROJECT: demo-bjj-exams-resilience
          GOOGLE_CLOUD_PROJECT: demo-bjj-exams-resilience
          FIREBASE_PROJECT_ID: demo-bjj-exams-resilience
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = 'demo-bjj-exams-resilience'
          test "$GOOGLE_CLOUD_PROJECT" = 'demo-bjj-exams-resilience'
          test "$FIREBASE_PROJECT_ID" = 'demo-bjj-exams-resilience'
          node --check tests/helpers/marco9-demo-emulator-boundary-v1_2.js
          node --check tests/marco9-recovery-demo-emulator-v1_2.test.js
          node --check tests/marco9-bounded-load-demo-emulator-v1_2.test.js
          npm exec --yes --package=firebase-tools@14.27.0 -- firebase emulators:exec --only firestore --project demo-bjj-exams-resilience "node tests/marco9-recovery-demo-emulator-v1_2.test.js && node tests/marco9-bounded-load-demo-emulator-v1_2.test.js"
          echo 'MARCO9_RECOVERY=DEMO_ONLY'
          echo 'MARCO9_LOAD=DEMO_ONLY'
          echo 'MARCO9_NO_DEPLOY=TRUE'
      - name: Marco 9 RC evidence and strict NO-GO preflight (no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node --check scripts/preflight-marco9-rc-v1_2.js
          node scripts/preflight-marco9-rc-v1_2.js
          node tests/marco9-rc-readiness-v1_2.test.js
          echo 'MARCO9_RC_DECISION=NO_GO'
          echo 'MARCO9_OPERATIONAL_ACCEPTANCE=NOT_COMPLETE'
          echo 'MARCO10_PRODUCTION_AUTHORIZATION=FORBIDDEN'
          echo 'STAGING_DEPLOY=NOT_RUN'
          echo 'PRODUCTION_ACCESS=NOT_RUN'
      - name: Marco 9 joint App Check/CSP staging browser smoke toolkit (mock only)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node --check scripts/probe-staging-http-security-v1_2.js
          node --check tests/marco9-staging-browser-smoke-prep-v1_2.test.js
          node tests/marco9-staging-browser-smoke-prep-v1_2.test.js
          echo 'STAGING_REAL_HTTP_PROBE=NOT_RUN'
          echo 'APP_CHECK_ENTERPRISE_REGISTRATION=NOT_RUN'
          echo 'CSP_BROWSER_SMOKE=NOT_RUN'
          echo 'STAGING_DEPLOY=NOT_RUN'
          echo 'MARCO9_RC_DECISION=NO_GO'
      - name: Marco 9 npm audit report schema and immutable action pins (mock only)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node --check scripts/summarize-npm-audit-v1_2.js
          node tests/marco9-npm-audit-ci-pins-v1_2.test.js
      - name: Marco 9 lockfile critical/high remediation regression (offline only)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node tests/marco9-npm-lock-fixes-v1_2.test.js
          node tests/marco9-uuid-override-compat-v1_2.test.js
      - name: Marco 9 dependency triage parser tests (offline only)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node --check scripts/triage-npm-advisories-v1_2.js
          node tests/marco9-npm-triage-v1_2.test.js
      - name: Marco 9 live npm advisory discovery (read-only, no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          audit_file="$(mktemp)"
          trap 'rm -f "$audit_file"' EXIT
          audit_status=0
          npm audit --prefix functions --omit=dev --json > "$audit_file" 2>/dev/null || audit_status=$?
          if [ "$audit_status" -gt 1 ]; then
            echo 'MARCO9_NPM_ADVISORY_QUERY=FAILED'
            exit 1
          fi
          node scripts/summarize-npm-audit-v1_2.js --stdin < "$audit_file"
          node scripts/triage-npm-advisories-v1_2.js --stdin < "$audit_file"
          node -e 'const fs=require("fs");const {classifyAuditJson}=require("./scripts/summarize-npm-audit-v1_2");const out=classifyAuditJson(fs.readFileSync(0,"utf8"));if(out.vulnerabilityCounts.total!==0){console.error("NPM_AUDIT_ZERO_GATE=BLOCKED");process.exitCode=1}else{console.log("NPM_AUDIT_ZERO_REPORTED_FINDINGS=PASSED")}' < "$audit_file"
          echo 'MARCO9_LIVE_NPM_AUDIT=EXECUTED_AGGREGATES_ONLY'
          echo 'MARCO9_CVE_TRIAGE=MANUAL_REVIEW_REQUIRED'
          echo 'MARCO9_9_4C_STAGING_NEGATIVE_TESTS=PENDING'
          echo 'MARCO9_RC_DECISION=NO_GO'
          echo 'PRODUCTION_ACCESS=NOT_RUN'
          echo 'DEPLOY_EXECUTED=False'
      - name: Marco 9 negative STRIDE handlers (synthetic only, no deploy)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node --check tests/marco9-stride-negative-handlers-v1_2.test.js
          node tests/marco9-stride-negative-handlers-v1_2.test.js
          echo 'MARCO9_STRIDE_REMOTE_STAGING=NOT_RUN'
      - name: Marco 9 log sink inventory (source only, no cloud logging)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node --check scripts/inventory-operational-logs-v1_2.js
          node scripts/inventory-operational-logs-v1_2.js
          node tests/marco9-log-inventory-v1_2.test.js
          echo 'MARCO9_CLOUD_LOGGING_IAM=NOT_INSPECTED'
          echo 'MARCO9_LGPD_RETENTION=UNAPPROVED'
          echo 'MARCO9_9_8_RC_DECISION=NO_GO'
          echo 'CLOUD_DEPLOY=NOT_RUN'
      - name: Marco 9 staging Hosting App Check/CSP artifact rollback (offline only)
        if: startsWith(github.head_ref, 'feature/marco9-')
        run: |
          set -euo pipefail
          node --check scripts/verify-staging-hosting-artifact-v1_2.js
          node --check tests/marco9-staging-artifact-rollout-v1_2.test.js
          node tests/marco9-staging-artifact-rollout-v1_2.test.js
          node scripts/verify-staging-hosting-artifact-v1_2.js --verify-pristine
          echo 'MARCO9_REAL_APPCHECK_SITEKEY=NOT_REGISTERED'
          echo 'MARCO9_STAGING_BROWSER_SMOKE=NOT_RUN'
          echo 'MARCO9_CSP_ENFORCEMENT=NOT_ENABLED'
          echo 'MARCO9_STAGING_DEPLOY=NOT_RUN'
          echo 'MARCO9_RC_DECISION=NO_GO'
